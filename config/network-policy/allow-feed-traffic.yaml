# Allow ingress to the iCal feed HTTP server (container port 8082).
# Without this, enabling NetworkPolicy leaves only metrics:8443 open and
# silently breaks feed delivery via the feed Service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/name: cron-ical-controller
    app.kubernetes.io/managed-by: kustomize
  name: allow-feed-traffic
  namespace: system
spec:
  podSelector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: cron-ical-controller
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8082
          protocol: TCP
