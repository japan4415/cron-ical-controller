---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: cronicalfeeds.cron-ical.discord.jp
spec:
  group: cron-ical.discord.jp
  names:
    kind: CronICalFeed
    listKind: CronICalFeedList
    plural: cronicalfeeds
    singular: cronicalfeed
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Number of matched CronJobs
      jsonPath: .status.cronJobCount
      name: CronJobs
      type: integer
    - description: Feed endpoint path
      jsonPath: .status.feedURL
      name: Feed URL
      type: string
    - description: Whether the feed is ready
      jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          CronICalFeed is the Schema for the cronicalfeeds API.
          It exports CronJob schedules as iCalendar (.ics) feeds.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of CronICalFeed
            properties:
              defaultDuration:
                default: 0s
                description: |-
                  defaultDuration is the default duration for CronJob events when the
                  cron-ical.discord.jp/avg-duration label is not set.
                  Must be a valid Go time.Duration string (e.g. "5m", "1h30m").
                type: string
              defaultTimeZone:
                default: UTC
                description: |-
                  defaultTimeZone is the IANA timezone name to use when a CronJob does not
                  have its .spec.timeZone field set.
                type: string
              selector:
                description: selector specifies the criteria for selecting target
                  CronJobs.
                properties:
                  labelSelector:
                    description: labelSelector filters CronJobs by labels.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                  namespaces:
                    description: |-
                      namespaces is a list of namespaces to search for CronJobs.
                      If empty, the CronICalFeed's own namespace is used.
                    items:
                      type: string
                    type: array
                type: object
              serve:
                description: serve configures the HTTP endpoint for the iCal feed.
                properties:
                  path:
                    description: |-
                      path overrides the HTTP endpoint path.
                      Defaults to /feeds/{namespace}/{name}.ics
                    type: string
                type: object
              window:
                default: 7
                description: window is the number of days into the future to generate
                  iCal events for.
                format: int32
                maximum: 90
                minimum: 1
                type: integer
            type: object
          status:
            description: status defines the observed state of CronICalFeed
            properties:
              conditions:
                description: |-
                  conditions represent the latest available observations of the CronICalFeed's state.

                  Condition types:
                  - "Ready": the feed is successfully generated and available for serving
                  - "CronJobsFound": at least one target CronJob was found
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              cronJobCount:
                description: cronJobCount is the number of CronJobs currently matched
                  by the selector.
                format: int32
                type: integer
              feedURL:
                description: feedURL is the HTTP path where this feed is served.
                type: string
              lastGeneratedAt:
                description: lastGeneratedAt is the timestamp when the .ics feed was
                  last generated.
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
