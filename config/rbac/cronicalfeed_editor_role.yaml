# This rule is not used by the project cron-ical-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the cron-ical.discord.jp.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: cron-ical-controller
    app.kubernetes.io/managed-by: kustomize
  name: cronicalfeed-editor-role
rules:
- apiGroups:
  - cron-ical.discord.jp
  resources:
  - cronicalfeeds
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - cron-ical.discord.jp
  resources:
  - cronicalfeeds/status
  verbs:
  - get
