# This rule is not used by the project cron-ical-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to cron-ical.discord.jp resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: cron-ical-controller
    app.kubernetes.io/managed-by: kustomize
  name: cronicalfeed-viewer-role
rules:
- apiGroups:
  - cron-ical.discord.jp
  resources:
  - cronicalfeeds
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - cron-ical.discord.jp
  resources:
  - cronicalfeeds/status
  verbs:
  - get
